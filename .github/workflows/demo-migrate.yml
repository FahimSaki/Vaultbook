name: demo-migrate
# Applies new migrations to the hosted demo database after changes land on main.
# Secret needed: DEMO_MIGRATION_DATABASE_URL (the OWNER role's connection string, direct, not pooled).
on:
    push:
        branches: [main]
    workflow_dispatch:
jobs:
    migrate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v4
              with: { node-version: 22, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec tsx scripts/migrate.ts
              env:
                  MIGRATION_DATABASE_URL: ${{ secrets.DEMO_MIGRATION_DATABASE_URL }}
